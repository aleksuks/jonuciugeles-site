<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#f7e6cf" />
    <title>Jonučių gėlės</title>
    <link rel="icon" type="image/png" href="/brand/mark-64.png" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f7e6cf; overscroll-behavior: none; }
      #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; outline: none; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #ui > * { pointer-events: auto; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
