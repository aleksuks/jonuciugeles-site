<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Flowers UI preview</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #e4ddd1; overscroll-behavior: none; }
      /* stands in for the full-viewport 3D canvas */
      #stage { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none;
        background: radial-gradient(ellipse at 50% 45%, #eae4d9 0%, #e4ddd1 60%, #ddd5c8 100%); }
      #fake { position: absolute; left: 50%; top: 42%; width: min(34vmin, 260px); height: min(30vmin, 230px); translate: -50% -50%; border-radius: 50%; background: #dd7f9b; opacity: .85; }
      #fake::after { content: ''; position: absolute; left: 50%; top: 100%; width: 10px; height: 38vmin; margin-left: -5px; background: #6b8a52; }
      /* same rules as the real index.html, to prove the UI root stays click-through */
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #ui > * { pointer-events: auto; }
    </style>
  </head>
  <body>
    <div id="stage"><div id="fake"></div></div>
    <div id="ui"></div>
    <script type="module" src="/preview/ui.ts"></script>
  </body>
</html>
